aid: reality-defender
name: Reality Defender
description: >-
  Reality Defender is an enterprise deepfake and AI-generated media detection
  platform that identifies manipulated images, video, audio, and text across
  calls, meetings, onboarding, and access workflows in real time. Its detection
  API accepts uploaded media or social-media URLs and returns an ensemble
  verdict aggregating multiple purpose-built detection models, letting platforms,
  financial institutions, and governments block deepfakes before they authorize
  payments, spread disinformation, or deceive AI agents. Reality Defender ships
  official SDKs for TypeScript, Python, Go, Rust, and Java, an open-source MCP
  server for agent integrations, and a Slack app. It was surfaced as a portfolio
  company of DCVC.
