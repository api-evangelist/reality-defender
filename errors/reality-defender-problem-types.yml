    title: Too many requests
    cause: Rate limit exceeded.
    remediation: Back off and retry; the async submit-then-poll flow should space polling.
  - status: 500
    title: Internal server error
    cause: Unexpected server-side failure.
    remediation: Retry with backoff; contact support if persistent.
